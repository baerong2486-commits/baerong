<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배롱 · 옷장</title>
  <meta name="description" content="배롱 FLOWER DIARY — 옷장">
  <link rel="icon" type="image/jpeg" href="https://profile.img.sooplive.co.kr/LOGO/ba/baerong2/baerong2.jpg">
  <link rel="stylesheet" href="../style.css">
  <style>
    .dr-bar { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
    .seg { display:inline-flex; gap:5px; padding:4px; border-radius:999px; background:var(--main-light); }
    .cats { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }

    /* ── 새 옷 = 포스터 ── */
    .ps-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; border-bottom:2px solid var(--main-dark); padding-bottom:7px; margin-bottom:18px; }
    .ps-head .t { font:400 clamp(30px,3.4vw,50px)/.95 var(--f-hand); color:var(--main-deep); }
    .ps-head .m { font:800 10.5px/1 var(--f-micro); letter-spacing:.16em; color:var(--main-dark); padding-bottom:6px; white-space:nowrap; }
    .ps-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    @media(max-width:900px){ .ps-grid{ grid-template-columns:repeat(2,1fr); gap:12px; } }
    @media(max-width:520px){ .ps-grid{ grid-template-columns:1fr; } }

    .ps { position:relative; aspect-ratio:3/4; overflow:hidden; cursor:pointer; background:#2b2229; box-shadow:var(--shadow); transition:var(--transition); }
    .ps:hover { transform:translateY(-5px); box-shadow:var(--shadow-hover); }
    .ps img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; transition:transform .5s ease; }
    .ps:hover img { transform:scale(1.05); }
    .ps .noimg { position:absolute; inset:0; display:grid; place-items:center; font-size:42px; opacity:.4; color:#fff; }
    .ps::before { content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
      background:linear-gradient(to bottom, rgba(0,0,0,.45), transparent 26%, transparent 48%, rgba(0,0,0,.86)); }
    .ps .fr { position:absolute; inset:10px; border:1px solid rgba(255,255,255,.5); z-index:3; pointer-events:none; }
    .ps .top { position:absolute; top:0; left:0; right:0; z-index:4; padding:15px 16px; display:flex; justify-content:space-between; gap:8px; color:#fff; }
    .ps .brand { font:800 10.5px/1 var(--f-micro); letter-spacing:.24em; text-shadow:0 1px 4px rgba(0,0,0,.6); }
    .ps .new { font:800 9.5px/1 var(--f-micro); letter-spacing:.08em; background:var(--main-dark); color:#fff; padding:4px 10px; border-radius:999px; }
    .ps .bot { position:absolute; left:0; right:0; bottom:0; z-index:4; padding:17px 17px 18px; color:#fff; }
    .ps .cat { display:inline-block; font:800 10px/1 var(--f-micro); letter-spacing:.06em; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.4); padding:4px 10px; border-radius:999px; margin-bottom:10px; }
    .ps .ln { width:24px; height:2.5px; background:var(--main); margin-bottom:9px; }
    .ps .nm { font-size:21px; font-weight:900; line-height:1.15; text-shadow:0 2px 8px rgba(0,0,0,.65); word-break:keep-all; }
    .ps .dt { margin-top:8px; font:800 10px/1 var(--f-micro); letter-spacing:.08em; opacity:.9; }
    .ps .ds { margin-top:6px; font-size:11.5px; line-height:1.5; opacity:.85; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

    /* ── 기존 옷 = 앨범 ── */
    .al-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
    @media(max-width:900px){ .al-grid{ grid-template-columns:repeat(3,1fr); gap:11px; } }
    @media(max-width:560px){ .al-grid{ grid-template-columns:repeat(2,1fr); gap:10px; } }
    .al {
      position:relative; aspect-ratio:3/4; overflow:hidden; cursor:pointer;
      border:1px solid var(--pline); background:var(--main-light); transition:var(--transition);
      box-shadow:3px 4px 0 rgba(183,133,151,.12);
    }
    .al:hover { transform:translateY(-4px); box-shadow:var(--shadow-hover); }
    .al img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .35s ease; }
    .al:hover img { transform:scale(1.05); }
    .al .noimg { position:absolute; inset:0; display:grid; place-items:center; font-size:36px; opacity:.35; }
    .al .fr { position:absolute; inset:9px; z-index:3; border:1px solid rgba(255,255,255,.55); pointer-events:none; }
    .al.no-img .fr { border-color:var(--pline); }
    .al .brand {
      position:absolute; top:14px; left:15px; z-index:4;
      font:800 9px/1 var(--f-micro); letter-spacing:.22em; color:#fff;
      text-shadow:0 1px 4px rgba(0,0,0,.6);
    }
    .al.no-img .brand { color:var(--main-dark); text-shadow:none; }
    .al .cap { position:absolute; left:0; right:0; bottom:0; padding:24px 12px 11px; color:#fff; pointer-events:none;
      background:linear-gradient(to top, rgba(0,0,0,.76), rgba(0,0,0,.28) 55%, transparent); }
    .al .cap .n { font-size:13.5px; font-weight:800; line-height:1.25; text-shadow:0 1px 3px rgba(0,0,0,.5); }
    .al .cap .d { font-size:11px; opacity:.9; margin-top:3px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .al.no-img .cap { background:linear-gradient(to top, var(--card) 32%, transparent); color:var(--text); }
    .al.no-img .cap .n { text-shadow:none; }
    .zoom { position:absolute; top:9px; right:9px; z-index:3; width:26px; height:26px; border-radius:50%; background:rgba(0,0,0,.34); color:#fff; display:grid; place-items:center; font-size:13px; opacity:0; transition:opacity .2s; }
    .al:hover .zoom, .ps:hover .zoom { opacity:1; }
  </style>
</head>
<body class="sub" data-page="dress" data-title="옷장">
<script>if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark');</script>

<header class="flower-header">
    <a class="flower-logo" href="../profile/" aria-label="배롱 프로필"><span class="fl">✿</span><span class="wm" data-site="logo-text">배롱</span></a>
    <nav class="flower-nav" aria-label="페이지 메뉴">
      <a data-nav="profile" href="../profile/">프로필</a>
      <a data-nav="schedule" href="../schedule/">일정</a>
      <a data-nav="notice" href="../notice/">공지</a>
      <a data-nav="work" href="../work/">업보</a>
      <a data-nav="dress" href="../dress/">옷장</a>
    </nav>
    <div class="flower-tools">
      <button class="dk-toggle" id="dkToggle" type="button" aria-label="다크 모드 전환"><i id="dkKnob">☾</i></button>
      <button class="ask" type="button" onclick="openAsk()">✉ 문의</button>
    </div>
  </header>

<main class="dwrap wrap stagger">

  <section class="dsheet">
    <span class="tape r"></span>
    <span class="doodle d1">✿</span>
    <div class="sheet-head">
      <div class="sheet-title-row">
        <h1 class="sheet-title" data-site="hd-dress-title">옷장</h1>
        <span class="sheet-en" data-site="hd-dress-en">baerong's closet</span>
      </div>
      <p class="sheet-desc" data-site="hd-dress-desc">새로 갈아입은 옷은 포스터로, 이미 입던 옷은 기존 옷에서 볼 수 있어요. 사진을 누르면 크게 볼 수 있어요.</p>
      <div class="sheet-rule"></div>
    </div>

    <div class="dr-bar">
      <div class="seg" id="seg">
        <button class="pill on" type="button" data-mode="new" data-site="lbl-new">✨ 새 옷</button>
        <button class="pill" type="button" data-mode="old" data-site="lbl-old">🗂 기존 옷</button>
      </div>
    </div>
    <div class="cats" id="cats"></div>
    <div id="drBody"><div class="spinner"></div></div>
  </section>

</main>

  <span class="x" onclick="closeLb()">×</span>
  <div class="inner">
    <img id="lbImg" src="" alt="">
    <div class="cap"><div class="n" id="lbName"></div><div class="d" id="lbDesc"></div></div>
  </div>
</div>

</footer>

    <p data-site="ask-desc">배롱에게 하고 싶은 말을 남겨주세요. 익명으로 전달돼요 🍀</p>

      <button class="no" type="button" onclick="closeAsk()">취소</button>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="../supabase.js"></script>
<script src="../site.js"></script>
<script>
/* ── 분류 (admin select 옵션 + admin DRESS_CATS 와 반드시 같은 값) ── */
var CATS = [
  { key:'outfit', label:'의상' },
  { key:'hair',   label:'헤어' }
];
var LABELS = {}; CATS.forEach(function(c){ LABELS[c.key] = c.label; });
var PER = 8;

var items = [], curCat = CATS[0].key, curMode = 'new', curPage = 1, pageItems = [];

function isNew(it){
  var b = it.badges;
  if (!Array.isArray(b)) return false;
  return b.some(function(x){
    var l = (x && (x.label != null ? x.label : x)) || '';
    return String(l).trim().toUpperCase() === 'NEW';
  });
}
function fmt(s){
  var d = new Date(s);
  if (isNaN(d)) return '';
  return String(d.getFullYear()).slice(2) + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0');
}
/* 정렬 기준은 관리자 목록과 같아야 함: sort_order 오름차순, 같으면 최신순 */
function view(){
  return items.filter(function(i){
    return asText(i.category) === curCat && (curMode === 'new' ? isNew(i) : !isNew(i));
  }).sort(function(a,b){
    var d = (a.sort_order || 0) - (b.sort_order || 0);
    if (d) return d;
    return new Date(b.created_at||0) - new Date(a.created_at||0);
  });
}

function buildCats(){
  var w = document.getElementById('cats');
  w.innerHTML = CATS.map(function(c){
    var n = items.filter(function(i){
      return asText(i.category) === c.key && (curMode === 'new' ? isNew(i) : !isNew(i));
    }).length;
    return '<button class="pill' + (c.key === curCat ? ' on' : '') + '" type="button" data-cat="' + c.key + '">' +
           c.label + ' <span class="cnt">' + n + '</span></button>';
  }).join('');
  w.querySelectorAll('[data-cat]').forEach(function(b){
    b.onclick = function(){ curCat = b.dataset.cat; curPage = 1; buildCats(); render(); };
  });
}

function posterHTML(list){
  return '<div class="ps-head"><div class="t">new looks</div><div class="m">' + esc(pv('info-en')) + ' · ' + esc(LABELS[curCat] || '') + '</div></div>' +
    '<div class="ps-grid">' + list.map(function(it, i){
      var u = asText(it.image_url).trim();
      return '<div class="ps" data-i="' + i + '">' +
        (u ? '<img src="' + esc(u) + '" alt="' + esc(asText(it.name)) + '" loading="lazy" referrerpolicy="no-referrer">' : '<span class="noimg">👗</span>') +
        (u ? '<div class="zoom">⤢</div>' : '') +
        '<div class="fr"></div>' +
        '<div class="top"><span class="brand">' + esc(pv('info-en')) + '</span><span class="new">✦ NEW</span></div>' +
        '<div class="bot">' +
          '<span class="cat">' + esc(LABELS[asText(it.category)] || '') + '</span>' +
          '<div class="ln"></div>' +
          '<div class="nm">' + esc(asText(it.name)) + '</div>' +
          (it.created_at ? '<div class="dt">' + fmt(it.created_at) + '</div>' : '') +
          (asText(it.description) ? '<div class="ds">' + esc(asText(it.description)) + '</div>' : '') +
        '</div></div>';
    }).join('') + '</div>';
}

function albumHTML(list){
  return '<div class="al-grid">' + list.map(function(it, i){
    var u = asText(it.image_url).trim();
    return '<div class="al' + (u ? '' : ' no-img') + '" data-i="' + i + '">' +
      (u ? '<div class="zoom">⤢</div><img src="' + esc(u) + '" alt="' + esc(asText(it.name)) + '" loading="lazy" referrerpolicy="no-referrer">' : '<span class="noimg">👗</span>') +
      '<div class="fr"></div><span class="brand">' + esc(pv('info-en')) + '</span>' +
      '<div class="cap"><div class="n">' + esc(asText(it.name)) + '</div>' +
      (asText(it.description) ? '<div class="d">' + esc(asText(it.description)) + '</div>' : '') + '</div></div>';
  }).join('') + '</div>';
}

function render(){
  var body = document.getElementById('drBody');
  var list = view();
  if (!list.length){
    body.innerHTML = curMode === 'new'
      ? '<div class="empty"><div class="empty-icon">✨</div>' + (LABELS[curCat]||'') + ' 새 옷이 아직 없어요<br><span style="font-size:12px;opacity:.85">관리자에서 옷을 올릴 때 “✨ 새 옷으로 올리기”를 체크하면 여기 포스터로 떠요</span></div>'
      : '<div class="empty"><div class="empty-icon">👗</div>' + (LABELS[curCat]||'') + ' 항목이 아직 없어요</div>';
    try { initIframeResize(); } catch(e){}
    return;
  }
  var pages = Math.max(1, Math.ceil(list.length / PER));
  if (curPage > pages) curPage = 1;
  pageItems = list.slice((curPage-1)*PER, curPage*PER);

  var pager = '';
  if (pages > 1){
    pager = '<div class="pager">';
    for (var i = 1; i <= pages; i++) pager += '<button class="pg' + (i === curPage ? ' on' : '') + '" type="button" data-pg="' + i + '">' + i + '</button>';
    pager += '</div>';
  }
  body.innerHTML = (curMode === 'new' ? posterHTML(pageItems) : albumHTML(pageItems)) + pager;

  body.querySelectorAll('[data-i]').forEach(function(el){
    el.onclick = function(){
      var it = pageItems[+el.dataset.i];
      if (it && asText(it.image_url).trim()) openLb(it);
    };
  });
  body.querySelectorAll('.pg').forEach(function(b){
    b.onclick = function(){ curPage = +b.dataset.pg; render(); window.scrollTo({ top:0, behavior:'smooth' }); };
  });
  try { initIframeResize(); } catch(e){}
}

function openLb(it){
  document.getElementById('lbImg').src = asText(it.image_url);
  document.getElementById('lbName').textContent = asText(it.name);
  var d = document.getElementById('lbDesc');
  d.textContent = asText(it.description);
  d.style.display = asText(it.description) ? 'block' : 'none';
  document.getElementById('lb').classList.add('open');
}
function closeLb(){ document.getElementById('lb').classList.remove('open'); }
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeLb(); });

async function load(){
  await loadProfile();
  applySite();
  try {
    items = (await fetchAll('dress_items', { order:'sort_order', asc:true })) || [];
    items.sort(function(a,b){ return ((a.sort_order||0)-(b.sort_order||0)) || (new Date(a.created_at) - new Date(b.created_at)); });
  } catch(e){ items = []; }

  document.querySelectorAll('#seg [data-mode]').forEach(function(b){
    b.onclick = function(){
      curMode = b.dataset.mode; curPage = 1;
      document.querySelectorAll('#seg [data-mode]').forEach(function(x){ x.classList.toggle('on', x.dataset.mode === curMode); });
      buildCats(); render();
    };
  });
  buildCats(); render();
  markReady();
}
load();
</script>
<script src="../fx.js"></script>
<script src="../fxfb.js"></script>
</body>
</html>
